name: YPerf quality gate
on:
  push:
    branches: [main, "develop/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint all PHP files
        run: |
          if ! find . -name '*.php' -type f -print -quit | grep -q .; then
            echo 'No PHP plugin sources uploaded yet — cannot pass PHP release gate'
            exit 1
          fi
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Prewarm same-origin redirect regression
        run: php tests/prewarm-redirect-regression.php
      - name: Cacheability same-origin redirect regression
        run: php tests/cacheability-redirect-regression.php
      - name: Cloudflare purge same-origin regression
        run: php tests/cloudflare-origin-regression.php
      - name: Admin action capability and nonce regression
        run: php tests/admin-action-security-regression.php

  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS files
        run: |
          if ! find . -name '*.js' -type f -print -quit | grep -q .; then
            echo 'No JS source uploaded yet — cannot pass JS gate'
            exit 1
          fi
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  wordpress-checks:
    name: WordPress standards and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Assert source entrypoint
        run: test -f yablonsky-performance.php
      - name: Check version canon and localization inventory
        run: python3 tests/release-metadata-regression.py
      - name: Install WordPress coding standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer:^3.11 wp-coding-standards/wpcs:^3.2 dealerdirect/phpcodesniffer-composer-installer:^1.0
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/composer/vendor/bin" >> "$GITHUB_PATH"
      - name: Run WPCS
        run: |
          phpcs --standard=WordPress --extensions=php --ignore='*/languages/*,*/vendor/*,*/tests/*' .
      - name: Stage plugin-only tree for Plugin Check
        if: ${{ always() && hashFiles('yablonsky-performance.php') != '' }}
        run: |
          mkdir -p .yperf-plugincheck
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.yperf-plugincheck/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            ./ .yperf-plugincheck/
          test -f .yperf-plugincheck/yablonsky-performance.php
      - name: Run official Plugin Check
        if: ${{ always() && hashFiles('yablonsky-performance.php') != '' }}
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '.yperf-plugincheck'
