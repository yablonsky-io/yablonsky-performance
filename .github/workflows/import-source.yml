name: Import verified YPerf source
on:
  push:
    branches: [main]
    paths:
      - '_source-import/**'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and assemble source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f _source-import/chunk-00.b64
          cat _source-import/chunk-*.b64 | base64 --decode > /tmp/yperf-source.zip
          echo '33d179136ac1d7e1a7ffd6e0290e4acc27261d6ed7f41173cdb94cde744aea5f  /tmp/yperf-source.zip' | sha256sum -c -
          unzip -t /tmp/yperf-source.zip | tail -1
      - name: Extract verified source
        shell: bash
        run: |
          set -euo pipefail
          unzip -qo /tmp/yperf-source.zip -d .
          test -f yablonsky-performance.php
          count="$(unzip -Z1 /tmp/yperf-source.zip | grep -cv '/$')"
          test "$count" -eq 177
          rm -rf _source-import
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'source: import verified YPerf 2.56.0 workset (177 files)'
          git push origin HEAD:main
