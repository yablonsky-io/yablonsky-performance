name: YPerf WordPress release package

# A single, explicit packaging workflow. This workflow does not run on
# unrelated documentation commits, does not mutate PHP or JS, and does not
# reformat established source. The first published GitHub Release is a
# prerelease until separate WordPress.org publication compliance is accepted.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-release-package.py'
      - '.github/workflows/package-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Set up supported PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Syntax-check shipped plugin PHP
        run: |
          find includes runtime -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l yablonsky-performance.php
      - name: Build installation ZIP from runtime-only allowlist
        run: python3 scripts/build-release-package.py
      - name: Verify package layout and inspect exact distribution
        run: |
          test -f dist/yablonsky-performance-2.56.0.zip
          mkdir -p .release-check
          unzip -q dist/yablonsky-performance-2.56.0.zip -d .release-check
          test -f .release-check/yablonsky-performance/yablonsky-performance.php
          test -f .release-check/yablonsky-performance/readme.txt
          test -f .release-check/yablonsky-performance/LICENSE
          test ! -d .release-check/yablonsky-performance/.github
          test ! -f .release-check/yablonsky-performance/AGENTS.md
          test ! -d .release-check/yablonsky-performance/scripts
          sha256sum dist/yablonsky-performance-2.56.0.zip
      - name: Official Plugin Check on the package tree
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '.release-check/yablonsky-performance'
      - name: Create a GitHub prerelease with the exact installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.56.0 >/dev/null 2>&1; then
            echo 'Release v2.56.0 already exists; preserving its existing assets.'
            exit 0
          fi
          cat > /tmp/yperf-release-notes.md <<'NOTES'
          ## Yablonsky Performance 2.56.0 — installation candidate

          This is the preserved YPerf 2.56.0 functional baseline, provided as
          a correctly structured WordPress installation ZIP for controlled
          distribution and final WordPress.org publication preparation.

          **GitHub prerelease:** Production runtime acceptance was previously
          completed on a representative live installation (25 PASS / 0 FAIL).
          WordPress.org publication compliance, including remaining WPCS
          findings, is tracked separately and has not yet been claimed as PASS.

          ### Core capabilities
          - Local-first page cache, cacheability policy, invalidation and prewarm
          - Optional Redis object cache and bounded cache ownership handover
          - WooCommerce-aware frontend optimization and origin protection
          - Runtime Acceptance, operational evidence and local Autopilot
          - Optional Cloudflare, W3 Total Cache and Yablonsky AI integrations

          ### Installation
          Use **yablonsky-performance-2.56.0.zip** from the Assets section.
          Do not use GitHub's automatically generated source-code archives as
          WordPress installation files.

          For published licensing, support, security and operating boundaries,
          see the repository README and WordPress readme.txt.

          The prerelease designation does not imply a new feature train or
          altered runtime behavior. The plugin version remains 2.56.0.
          NOTES
          gh release create v2.56.0 dist/yablonsky-performance-2.56.0.zip             --prerelease             --target "${GITHUB_SHA}"             --title 'Yablonsky Performance 2.56.0'             --notes-file /tmp/yperf-release-notes.md
