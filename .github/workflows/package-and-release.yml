name: YPerf WordPress release package

# A single, explicit packaging workflow. This workflow does not run on
# unrelated documentation commits, does not mutate PHP or JS, and does not
# reformat established source. A GitHub Release is a distribution channel, not WordPress.org approval.
# Preserve exact existing release assets when presenting the release as stable.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-release-package.py'
      - '.github/workflows/package-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Set up supported PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Syntax-check shipped plugin PHP
        run: |
          find includes runtime -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l yablonsky-performance.php
      - name: Build installation ZIP from runtime-only allowlist
        run: python3 scripts/build-release-package.py
      - name: Verify package layout and inspect exact distribution
        run: |
          test -f dist/yablonsky-performance-2.56.0.zip
          mkdir -p .release-check
          unzip -q dist/yablonsky-performance-2.56.0.zip -d .release-check
          test -f .release-check/yablonsky-performance/yablonsky-performance.php
          test -f .release-check/yablonsky-performance/readme.txt
          test -f .release-check/yablonsky-performance/LICENSE
          test ! -d .release-check/yablonsky-performance/.github
          test ! -f .release-check/yablonsky-performance/AGENTS.md
          test ! -d .release-check/yablonsky-performance/scripts
          sha256sum dist/yablonsky-performance-2.56.0.zip
      - name: Official Plugin Check on the package tree
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '.release-check/yablonsky-performance'
      - name: Publish the verified GitHub Release (WordPress.org review stays separate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/yperf-release-notes.md <<'NOTES'
          ## Yablonsky Performance 2.56.0

          WordPress performance, page caching and origin protection —
          local-first, measurable and under administrator control.

          ### What's included
          - Page caching, cacheability rules, selective purge and prewarm
          - Redis object caching with isolation and ownership safeguards
          - WooCommerce-aware frontend optimization and origin protection
          - Runtime Acceptance, performance evidence and local Autopilot
          - Optional Cloudflare, W3 Total Cache and Yablonsky AI integrations

          ### Verified distribution
          The plugin's existing functional baseline was accepted on a live
          installation with 25 PASS, 0 FAIL, 3 SKIP and 11 ATTENTION.
          The WordPress installation ZIP was generated and integrity-checked;
          PHP syntax and official Plugin Check completed successfully.

          **WordPress.org publication:** separate review; outstanding WPCS
          findings remain documented. A GitHub stable release does not imply
          WordPress.org directory approval.

          ### Installation
          Download **yablonsky-performance-2.56.0.zip** from Assets below.
          Do not use GitHub's automatic Source code archives as plugin ZIPs.

          SHA-256 (published asset):
          cd3af61a96797934573a3f43c4ea860e9ad2a81c2a21d07b604dc514af9dd259
          NOTES
          if gh release view v2.56.0 >/dev/null 2>&1; then
            asset_name="$(gh release view v2.56.0 --json assets --jq '.assets[].name' | grep -Fx 'yablonsky-performance-2.56.0.zip' || true)"
            if [ -z "$asset_name" ]; then
              echo 'Existing release lacks the accepted ZIP: aborting promotion.'
              exit 1
            fi
            gh release edit v2.56.0 --prerelease=false --title 'Yablonsky Performance 2.56.0' --notes-file /tmp/yperf-release-notes.md
          else
            gh release create v2.56.0 dist/yablonsky-performance-2.56.0.zip --latest \
              --target "${GITHUB_SHA}" \
              --title 'Yablonsky Performance 2.56.0' \
              --notes-file /tmp/yperf-release-notes.md
          fi
